<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B4E53" />
      <stop offset="55%" stop-color="#35373B" />
      <stop offset="100%" stop-color="#222428" />
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22" />
    </radialGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e6ea" />
    </linearGradient>
    <filter id="noteShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-6" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.72" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#topGlow)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4" />

  <g filter="url(#noteShadow)" fill="url(#noteGrad)">
    <!-- Top slanted beam -->
    <polygon points="184,128 384,96 384,158 184,190" />
    <!-- Left stem -->
    <rect x="184" y="132" width="32" height="218" rx="4" />
    <!-- Right stem -->
    <rect x="352" y="102" width="32" height="218" rx="4" />
    <!-- Left notehead -->
    <ellipse cx="164" cy="356" rx="56" ry="42" transform="rotate(-22 164 356)" />
    <!-- Right notehead -->
    <ellipse cx="332" cy="326" rx="56" ry="42" transform="rotate(-22 332 326)" />
  </g>
</svg>
